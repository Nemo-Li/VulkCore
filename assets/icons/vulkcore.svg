<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>VulkCore</title>
  <desc>A faceted ember-orange V surrounding a luminous core on a midnight-blue rounded tile.</desc>
  <defs>
    <linearGradient id="tile" x1="64" y1="24" x2="448" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26374c"/>
      <stop offset="0.52" stop-color="#142134"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="rim" x1="96" y1="24" x2="416" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62758c" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#34465c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#253346" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="ember" x1="132" y1="144" x2="266" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff9960"/>
      <stop offset="0.48" stop-color="#ff653d"/>
      <stop offset="1" stop-color="#de3e33"/>
    </linearGradient>
    <linearGradient id="gold" x1="368" y1="144" x2="250" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe0a0"/>
      <stop offset="0.45" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#ff7a35"/>
    </linearGradient>
    <linearGradient id="core" x1="256" y1="80" x2="256" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff6df"/>
      <stop offset="1" stop-color="#ffd18a"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tile)"/>
  <rect x="26" y="26" width="460" height="460" rx="102" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <!-- The broad silhouette stays legible at taskbar and title-bar sizes. -->
  <path d="M104 144H193L276 350L242 408Z" fill="url(#ember)"/>
  <path d="M104 144H128L252 386L242 408Z" fill="#ffbd80" fill-opacity="0.28"/>
  <path d="M319 144H408L291 408H242L226 372Z" fill="url(#gold)"/>
  <path d="M384 144H408L291 408H267Z" fill="#e96b30" fill-opacity="0.55"/>
  <!-- Three faces reference the engine's geometry and its central core. -->
  <path d="M256 80L300 105V155L256 180L212 155V105Z" fill="url(#core)"/>
  <path d="M256 80L300 105L256 131L212 105Z" fill="#fff4dc"/>
  <path d="M212 105L256 131V180L212 155Z" fill="#ffbc70"/>
  <path d="M256 131L300 105V155L256 180Z" fill="#ffe0a3"/>
</svg>
